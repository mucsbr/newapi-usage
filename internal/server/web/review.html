<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>内容审查</title>
    <style>
      :root {
        --bg: #edf1f6; --surface: rgba(255,255,255,.78); --solid: rgba(255,255,255,.94);
        --text: #182131; --muted: #647086; --line: rgba(53,67,91,.15);
        --accent: #087f5b; --accent-soft: rgba(8,127,91,.12);
        --warn: #a35f00; --warn-soft: rgba(245,158,11,.13);
        --bad: #c92a2a; --bad-soft: rgba(201,42,42,.12); --shadow: 0 16px 44px rgba(31,44,68,.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg:#10151c; --surface:rgba(28,35,46,.82); --solid:rgba(35,43,56,.95);
          --text:#f2f5f9; --muted:#aab5c6; --line:rgba(216,225,239,.14);
          --accent:#5ed6ad; --accent-soft:rgba(94,214,173,.12);
          --warn:#ffd166; --warn-soft:rgba(255,209,102,.12);
          --bad:#ff8787; --bad-soft:rgba(255,135,135,.12); --shadow:0 18px 52px rgba(0,0,0,.28);
        }
      }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
      button,input,select,textarea { font:inherit; border:1px solid var(--line); border-radius:7px; }
      input,select,textarea { background:var(--solid); color:var(--text); outline:none; }
      input,select { height:36px; padding:0 10px; }
      textarea { width:100%; min-height:148px; padding:10px; line-height:1.5; resize:vertical; }
      input:focus,select:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
      button { height:36px; padding:0 13px; border-color:transparent; background:var(--accent); color:#fff; cursor:pointer; font-weight:650; }
      button.secondary { color:var(--text); background:var(--solid); border-color:var(--line); }
      button.danger { color:var(--bad); background:var(--bad-soft); border-color:rgba(201,42,42,.25); }
      button.small { height:28px; padding:0 9px; font-size:11px; }
      button:disabled { opacity:.5; cursor:default; }
      h1,h2,p { margin:0; } h1{font-size:24px} h2{font-size:16px}
      .hidden { display:none!important; }
      .shell { width:min(1500px,calc(100vw - 28px)); margin:0 auto; }
      .glass { background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); backdrop-filter:blur(24px) saturate(150%); -webkit-backdrop-filter:blur(24px) saturate(150%); }
      header { position:sticky; top:0; z-index:20; background:rgba(237,241,246,.8); border-bottom:1px solid var(--line); backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%); }
      @media (prefers-color-scheme:dark){header{background:rgba(16,21,28,.82)}}
      .topbar { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
      .top-actions,.actions,.inline { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      main { padding:16px 0 36px; display:grid; gap:14px; }
      .muted { color:var(--muted); font-size:12px; }
      .section { overflow:hidden; }
      .section-head { min-height:54px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
      .section-body { padding:14px; }
      label { display:grid; gap:6px; color:var(--muted); font-size:12px; min-width:0; }
      .config-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
      .wide { grid-column:1/-1; }
      .pill { display:inline-flex; align-items:center; min-height:22px; padding:2px 7px; border:1px solid var(--line); border-radius:999px; background:var(--solid); color:var(--muted); font-size:11px; white-space:nowrap; }
      .pill.success { color:var(--accent); background:var(--accent-soft); border-color:rgba(8,127,91,.3); }
      .pill.warn { color:var(--warn); background:var(--warn-soft); border-color:rgba(163,95,0,.3); }
      .pill.error { color:var(--bad); background:var(--bad-soft); border-color:rgba(201,42,42,.3); }
      .job-grid { display:grid; grid-template-columns:minmax(300px,.7fr) minmax(0,1.3fr); gap:14px; }
      .job-form { display:grid; gap:12px; }
      .time-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .key-tools { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; }
      .key-list { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:7px; background:var(--solid); }
      .model-list { max-height:180px; }
      .key-option { display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center; gap:8px; min-height:38px; padding:7px 9px; border-bottom:1px solid var(--line); cursor:pointer; }
      .key-option:last-child{border-bottom:0}.key-option input{width:16px;height:16px;padding:0}
      .key-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-size:12px; font-weight:600; }
      .jobs { display:grid; gap:7px; max-height:408px; overflow:auto; }
      .job-row { display:grid; grid-template-columns:58px minmax(0,1fr) auto; align-items:center; gap:9px; padding:9px; border:1px solid var(--line); border-radius:7px; background:var(--solid); cursor:pointer; }
      .job-row.selected { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
      .job-main { min-width:0; display:grid; gap:4px; }.job-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650}
      .progress { height:7px; overflow:hidden; border-radius:4px; background:var(--line); }.progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}
      .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); border-bottom:1px solid var(--line); }
      .stat { min-width:0; padding:11px; border-right:1px solid var(--line); }.stat:last-child{border-right:0}.stat span{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;margin-top:5px;font-size:15px;overflow-wrap:anywhere}
      .result-filter { padding:10px 14px; display:flex; justify-content:space-between; gap:10px; align-items:end; border-bottom:1px solid var(--line); }
      .table-wrap { overflow:auto; } table{width:100%;min-width:1180px;border-collapse:collapse;font-size:11px} th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap} th{position:sticky;top:0;z-index:2;background:var(--solid);color:var(--muted);font-weight:600} tbody tr:last-child td{border-bottom:0}
      .num{text-align:right;font-variant-numeric:tabular-nums}.reason{max-width:320px;overflow:hidden;text-overflow:ellipsis}.empty{padding:28px;text-align:center;color:var(--muted)}
      .pagination{padding:10px 14px;display:flex;justify-content:flex-end;align-items:center;gap:8px;border-top:1px solid var(--line)}.pagination button{height:30px;padding:0 10px}
      .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(6,10,16,.58)}.modal-panel{width:min(1000px,100%);max-height:min(820px,calc(100vh - 36px));overflow:auto}
      .conversation{padding:14px;display:grid;gap:10px}.message{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--solid)}.message-role{color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase}.message-content{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5}
      @media(max-width:1050px){.job-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat:nth-child(4){border-right:0}}
      @media(max-width:700px){.shell{width:min(100vw - 18px,1500px)}.topbar{align-items:flex-start;padding:10px 0}.config-grid,.time-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(even){border-right:0}.result-filter{align-items:stretch;flex-direction:column}}
    </style>
  </head>
  <body>
    <header><div class="shell topbar"><div><h1>内容审查</h1><p class="muted">增量消息审查、风险继承与内容去重</p></div><div class="top-actions"><span id="pageStatus" class="pill">连接中</span><button id="back" class="secondary" type="button">返回总览</button></div></div></header>
    <main class="shell">
      <section class="section glass">
        <div class="section-head"><div><h2>审查模型配置</h2><p class="muted">OpenAI 兼容 Chat Completions 接口</p></div><span id="configStatus" class="pill">未配置</span></div>
        <div class="section-body config-grid">
          <label>Base URL<input id="baseURL" placeholder="https://api.example.com/v1" /></label>
          <label>API Key<input id="apiKey" type="password" placeholder="留空保留已保存 Key" autocomplete="off" /></label>
          <label>Model<input id="reviewModel" placeholder="gpt-5" /></label>
          <label>推理强度<select id="reasoningEffort"><option value="auto" selected>自动检测（推荐）</option><option value="omit">不发送</option><option value="no_think">no_think</option><option value="low">low</option><option value="high">high</option></select></label>
          <label class="wide">审查规则<textarea id="policy"></textarea></label>
          <div class="wide actions"><button id="saveConfig" type="button">保存配置</button><button id="testConfig" class="secondary" type="button">测试连接</button><span id="configMessage" class="muted"></span></div>
        </div>
      </section>
      <section class="job-grid">
        <div class="section glass">
          <div class="section-head"><div><h2>创建审查任务</h2><p class="muted">选择 Key 和请求时间范围</p></div></div>
          <div class="section-body job-form">
            <div class="time-grid"><label>开始时间<input id="start" type="datetime-local" /></label><label>结束时间<input id="end" type="datetime-local" /></label></div>
            <label>消息范围<select id="roleMode"><option value="user" selected>仅用户输入（推荐）</option><option value="user_tool">用户输入 + Tool</option><option value="all">所有新增消息</option></select></label>
            <div class="key-tools"><input id="keySearch" type="search" placeholder="搜索 Key 名称" /><button id="selectAll" class="secondary small" type="button">全选</button><button id="clearKeys" class="secondary small" type="button">清除</button></div>
            <div id="keyList" class="key-list"><div class="empty">加载中</div></div>
            <div class="key-tools"><span class="muted">这些 Key 在当前时间段使用过的模型</span><button id="selectAllModels" class="secondary small" type="button">全选</button><button id="clearModels" class="secondary small" type="button">清除</button></div>
            <div id="modelList" class="key-list model-list"><div class="empty">选择 Key 后加载模型</div></div>
            <div class="actions"><button id="startJob" type="button">开始审查</button><span id="selectedCount" class="muted">已选 0 个 Key · 0 个模型</span></div>
          </div>
        </div>
        <div class="section glass">
          <div class="section-head"><div><h2>审查任务</h2><p class="muted">任务在后台运行，重启后可继续</p></div><button id="reloadJobs" class="secondary small" type="button">刷新</button></div>
          <div id="jobs" class="section-body jobs"><div class="empty">没有任务</div></div>
        </div>
      </section>
      <section id="resultSection" class="section glass hidden">
        <div class="section-head"><div><h2 id="resultTitle">任务结果</h2><p id="resultSubtitle" class="muted">-</p></div><div id="jobActions" class="actions"></div></div>
        <div id="jobStats" class="stats"></div>
        <div class="result-filter"><div class="inline"><label>最终结论<select id="decisionFilter"><option value="">全部</option><option value="阻断">阻断</option><option value="复核">复核</option><option value="通过">通过</option></select></label><label>Key<select id="resultKeyFilter"><option value="">全部 Key</option></select></label></div><span id="resultMeta" class="pill">0 条</span></div>
        <div class="table-wrap"><table><thead><tr><th>时间</th><th>Key</th><th>请求模型</th><th>新增结论</th><th>最终结论</th><th class="num">风险分</th><th>分类</th><th>原因</th><th>来源</th><th>对话</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
        <div class="pagination"><button id="prevResult" class="secondary" type="button">上一页</button><span id="resultPageInfo" class="pill">1 / 1</span><button id="nextResult" class="secondary" type="button">下一页</button></div>
      </section>
    </main>
    <div id="conversationModal" class="modal hidden"><div class="modal-panel glass"><div class="section-head"><div><h2>原始对话</h2><p id="conversationMeta" class="muted">-</p></div><button id="closeConversation" class="secondary" type="button">关闭</button></div><div id="conversation" class="conversation"></div></div></div>
    <script>
      const state={keys:[],models:[],selectedKeys:new Set(),selectedModels:new Set(),modelLoadTimer:null,selectedJobId:0,resultPage:1,resultPageSize:50,poll:null};
      const el=(id)=>document.getElementById(id),fmt=new Intl.NumberFormat("zh-CN");
      const escapeHtml=(value)=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
      const tsText=(ts)=>ts?new Date(ts*1000).toLocaleString("zh-CN",{hour12:false}):"-";
      const dateToUnix=(value)=>{const ms=new Date(value).getTime();return Number.isFinite(ms)?Math.floor(ms/1000):0};
      const unixToInput=(ts)=>{const d=new Date(ts*1000);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
      const setDefaultRange=()=>{const now=Math.floor(Date.now()/1000);el("start").value=unixToInput(now-86400);el("end").value=unixToInput(now+3600)};
      const statusText=(v)=>({queued:"排队中",planning:"分析增量",running:"审查中",paused:"已暂停",completed:"已完成",canceled:"已取消",failed:"失败"})[v]||v;
      const decisionPill=(v)=>`<span class="pill ${v==="阻断"?"error":v==="复核"?"warn":"success"}">${escapeHtml(v||"-")}</span>`;
      const keyName=(id)=>state.keys.find((key)=>Number(key.token_id)===Number(id))?.key_name||`Token #${id}`;
      async function api(path,options={}){const response=await fetch(path,{credentials:"same-origin",...options});const data=await response.json().catch(()=>({}));if(!response.ok){if(response.status===401)window.location.href="/";throw new Error(data?.error?.message||response.statusText)}return data}
      const jsonOptions=(method,body)=>({method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const configInput=()=>({base_url:el("baseURL").value.trim(),api_key:el("apiKey").value.trim(),model:el("reviewModel").value.trim(),reasoning_effort:el("reasoningEffort").value,policy:el("policy").value.trim()});
      async function loadConfig(){const c=await api("/api/review/config");el("baseURL").value=c.base_url||"";el("reviewModel").value=c.model||"";el("reasoningEffort").value=c.reasoning_effort||"auto";el("policy").value=c.policy||"";el("apiKey").placeholder=c.key_configured?`已保存 Key · 尾号 ${c.key_tail||""}`:"sk-...";el("configStatus").textContent=c.key_configured?`${c.response_mode||"auto"} · ${c.reasoning_effort||"auto"}`:"未配置";el("configStatus").className=c.key_configured?"pill success":"pill warn"}
      async function saveConfig(){const c=await api("/api/review/config",jsonOptions("PUT",configInput()));el("apiKey").value="";el("configMessage").textContent="配置已保存";el("configStatus").textContent=`${c.response_mode||"auto"} · ${c.reasoning_effort||"auto"}`;el("configStatus").className="pill success";await loadConfig()}
      async function testConfig(){el("configMessage").textContent="正在测试…";const r=await api("/api/review/config/test",jsonOptions("POST",configInput()));el("reasoningEffort").value=r.reasoning_effort||el("reasoningEffort").value;el("configMessage").textContent=`连接正常，JSON 模式：${r.response_mode}，推理强度：${r.reasoning_effort}，测试结论：${r.decision?.decision||"-"}`}
      async function loadKeys(){state.keys=await api("/api/review/keys?limit=1000");renderKeys();renderResultKeyOptions()}
      function renderKeys(){const query=el("keySearch").value.trim().toLowerCase(),list=state.keys.filter((key)=>!query||`${key.key_name} ${key.key_tail}`.toLowerCase().includes(query));if(!list.length){el("keyList").innerHTML=`<div class="empty">没有匹配的 Key</div>`;return}el("keyList").innerHTML=list.map((key)=>`<label class="key-option"><input type="checkbox" data-token-check value="${key.token_id}" ${state.selectedKeys.has(Number(key.token_id))?"checked":""}/><span class="key-name" title="${escapeHtml(key.key_name||"")}">${escapeHtml(key.key_name||`Token #${key.token_id}`)}</span><span class="muted">${escapeHtml(key.key_tail||"")}</span></label>`).join("");document.querySelectorAll("[data-token-check]").forEach((box)=>box.addEventListener("change",()=>{const id=Number(box.value);if(box.checked)state.selectedKeys.add(id);else state.selectedKeys.delete(id);updateSelectedCount();scheduleModelLoad()}));updateSelectedCount()}
      const selectedTokenIDs=()=>Array.from(state.selectedKeys);
      const selectedRequestModels=()=>Array.from(state.selectedModels);
      const updateSelectedCount=()=>el("selectedCount").textContent=`已选 ${selectedTokenIDs().length} 个 Key · ${selectedRequestModels().length} 个模型`;
      function scheduleModelLoad(){clearTimeout(state.modelLoadTimer);state.modelLoadTimer=setTimeout(()=>loadModels().catch((error)=>{el("modelList").innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}),300)}
      async function loadModels(){const tokenIDs=selectedTokenIDs();if(!tokenIDs.length){state.models=[];state.selectedModels.clear();el("modelList").innerHTML=`<div class="empty">选择 Key 后加载模型</div>`;updateSelectedCount();return}el("modelList").innerHTML=`<div class="empty">加载模型中</div>`;const params=new URLSearchParams({token_ids:tokenIDs.join(","),start:dateToUnix(el("start").value),end:dateToUnix(el("end").value)});state.models=await api(`/api/review/models?${params}`);state.selectedModels=new Set(state.models.map((item)=>item.model));renderModels()}
      function renderModels(){if(!state.models.length){el("modelList").innerHTML=`<div class="empty">当前范围没有模型记录</div>`;updateSelectedCount();return}el("modelList").innerHTML=state.models.map((item)=>`<label class="key-option"><input type="checkbox" data-model-check value="${escapeHtml(item.model)}" ${state.selectedModels.has(item.model)?"checked":""}/><span class="key-name" title="${escapeHtml(item.model)}">${escapeHtml(item.model)}</span><span class="muted">${fmt.format(item.request_count||0)}次</span></label>`).join("");document.querySelectorAll("[data-model-check]").forEach((box)=>box.addEventListener("change",()=>{if(box.checked)state.selectedModels.add(box.value);else state.selectedModels.delete(box.value);updateSelectedCount()}));updateSelectedCount()}
      function renderResultKeyOptions(){const current=el("resultKeyFilter").value;el("resultKeyFilter").innerHTML=`<option value="">全部 Key</option>${state.keys.map((key)=>`<option value="${key.token_id}">${escapeHtml(key.key_name||`Token #${key.token_id}`)}</option>`).join("")}`;el("resultKeyFilter").value=current}
      async function startJob(){const tokenIDs=selectedTokenIDs(),models=selectedRequestModels();if(!tokenIDs.length)throw new Error("请至少选择一个 Key");if(!models.length)throw new Error("请至少选择一个使用过的模型");const job=await api("/api/review/jobs",jsonOptions("POST",{token_ids:tokenIDs,models,start:dateToUnix(el("start").value),end:dateToUnix(el("end").value),role_mode:el("roleMode").value}));state.selectedJobId=job.id;state.resultPage=1;await loadJobs();await selectJob(job.id)}
      async function loadJobs(){const jobs=await api("/api/review/jobs?limit=50");if(!jobs.length){el("jobs").innerHTML=`<div class="empty">没有任务</div>`;return}if(!state.selectedJobId)state.selectedJobId=jobs[0].id;el("jobs").innerHTML=jobs.map((job)=>{const progress=job.total_entries?Math.min(100,job.processed_entries/job.total_entries*100):(job.status==="completed"?100:0);return `<div class="job-row ${job.id===state.selectedJobId?"selected":""}" data-job-id="${job.id}"><span class="pill ${job.status==="failed"?"error":job.status==="completed"?"success":job.status==="paused"?"warn":""}">#${job.id}</span><span class="job-main"><span class="job-title">${job.token_ids.length} Key · ${tsText(job.start)} 至 ${tsText(job.end)}</span><span class="progress"><span style="width:${progress}%"></span></span></span><span class="muted">${statusText(job.status)} · ${fmt.format(job.processed_entries)}/${fmt.format(job.total_entries)}</span></div>`}).join("");document.querySelectorAll("[data-job-id]").forEach((row)=>row.addEventListener("click",()=>selectJob(Number(row.dataset.jobId))))}
      async function selectJob(id){state.selectedJobId=id;document.querySelectorAll("[data-job-id]").forEach((row)=>row.classList.toggle("selected",Number(row.dataset.jobId)===id));const job=await api(`/api/review/jobs/${id}`);renderJob(job);await loadResults()}
      function renderJob(job){el("resultSection").classList.remove("hidden");el("resultTitle").textContent=`任务 #${job.id}`;el("resultSubtitle").textContent=`${statusText(job.status)} · 审查模型 ${job.review_model||"-"} · 请求模型 ${(job.models||[]).join("、")} · ${job.token_ids.map(keyName).join("、")}${job.error?` · ${job.error}`:""}`;const stats=[["请求",job.total_entries],["已处理",job.processed_entries],["增量单元",job.review_units],["预计字符",job.estimated_chars],["已审增量",job.reviewed_units],["缓存复用",job.cache_hits],["风险请求",job.flagged_entries],["错误",job.error_entries],["模型 Tokens",(job.prompt_tokens||0)+(job.completion_tokens||0)]];el("jobStats").innerHTML=stats.map(([label,value])=>`<div class="stat"><span>${label}</span><strong>${fmt.format(value||0)}</strong></div>`).join("");const buttons=[];if(["queued","planning","running"].includes(job.status))buttons.push(`<button class="secondary small" data-action="pause">暂停</button>`);if(["paused","failed"].includes(job.status))buttons.push(`<button class="secondary small" data-action="resume">继续</button>`);if(!["completed","canceled"].includes(job.status))buttons.push(`<button class="danger small" data-action="cancel">取消</button>`);el("jobActions").innerHTML=buttons.join("");document.querySelectorAll("[data-action]").forEach((button)=>button.addEventListener("click",()=>jobAction(job.id,button.dataset.action)))}
      async function jobAction(id,action){await api(`/api/review/jobs/${id}/${action}`,jsonOptions("POST",{}));await loadJobs();await selectJob(id)}
      async function loadResults(){if(!state.selectedJobId)return;const params=new URLSearchParams({page:state.resultPage,page_size:state.resultPageSize});if(el("decisionFilter").value)params.set("decision",el("decisionFilter").value);if(el("resultKeyFilter").value)params.set("token_id",el("resultKeyFilter").value);renderResults(await api(`/api/review/jobs/${state.selectedJobId}/results?${params}`))}
      function renderResults(data){const pages=Math.max(1,Math.ceil((data.total||0)/data.page_size));el("resultMeta").textContent=`${fmt.format(data.total||0)} 条`;el("resultPageInfo").textContent=`${data.page} / ${pages}`;el("prevResult").disabled=data.page<=1;el("nextResult").disabled=data.page>=pages;if(!data.items?.length){el("resultsBody").innerHTML=`<tr><td colspan="10" class="empty">暂无结果</td></tr>`;return}el("resultsBody").innerHTML=data.items.map((item)=>{const source=[item.inherited?"继承":"新增",item.cache_hit?"缓存":"模型",item.status==="error"?"错误":""].filter(Boolean).join(" · "),effective=item.effective_result||item.delta_result||{},categories=effective.categories?.length?effective.categories.join("、"):"-",reason=item.error||effective.reason||item.delta_result?.reason||"-",conversation=item.log_id?`<button class="secondary small" data-log-id="${item.log_id}">查看</button>`:`<span class="muted">未匹配</span>`;return `<tr><td>${tsText(item.created_at)}</td><td>${escapeHtml(keyName(item.token_id))}</td><td>${escapeHtml(item.request_model||"")}</td><td>${decisionPill(item.delta_result?.decision||(item.status==="error"?"复核":"通过"))}</td><td>${decisionPill(item.effective_decision)}</td><td class="num">${fmt.format(item.effective_risk_score||0)}</td><td>${escapeHtml(categories)}</td><td class="reason" title="${escapeHtml(reason)}">${escapeHtml(reason)}</td><td>${escapeHtml(source)}</td><td>${conversation}</td></tr>`}).join("");document.querySelectorAll("[data-log-id]").forEach((button)=>button.addEventListener("click",()=>openConversation(button.dataset.logId)))}
      async function openConversation(logID){el("conversationModal").classList.remove("hidden");el("conversationMeta").textContent=`Log #${logID}`;el("conversation").innerHTML=`<div class="empty">加载中</div>`;const data=await api(`/api/logs/${logID}/audit`),item=data.items?.[0];if(!item){el("conversation").innerHTML=`<div class="empty">没有匹配到请求体</div>`;return}el("conversationMeta").textContent=`${tsText(data.log?.created_at)} · ${data.log?.model_name||""}`;el("conversation").innerHTML=(item.messages||[]).map((message)=>`<div class="message"><div class="message-role">${escapeHtml(message.role||"message")}</div><div class="message-content">${escapeHtml(message.content||"")}</div></div>`).join("")||`<div class="empty">没有可显示的消息</div>`}
      function startPolling(){clearInterval(state.poll);state.poll=setInterval(async()=>{if(!state.selectedJobId||document.hidden)return;try{await loadJobs();await selectJob(state.selectedJobId)}catch(error){console.error(error)}},4000)}
      el("back").addEventListener("click",()=>window.location.href="/");
      el("saveConfig").addEventListener("click",()=>saveConfig().catch((error)=>el("configMessage").textContent=error.message));
      el("testConfig").addEventListener("click",()=>testConfig().catch((error)=>el("configMessage").textContent=error.message));
      el("keySearch").addEventListener("input",renderKeys);
      el("selectAll").addEventListener("click",()=>{document.querySelectorAll("[data-token-check]").forEach((box)=>state.selectedKeys.add(Number(box.value)));renderKeys();scheduleModelLoad()});
      el("clearKeys").addEventListener("click",()=>{state.selectedKeys.clear();renderKeys();scheduleModelLoad()});
      el("selectAllModels").addEventListener("click",()=>{state.models.forEach((item)=>state.selectedModels.add(item.model));renderModels()});
      el("clearModels").addEventListener("click",()=>{state.selectedModels.clear();renderModels()});
      el("start").addEventListener("change",scheduleModelLoad);el("end").addEventListener("change",scheduleModelLoad);
      el("startJob").addEventListener("click",()=>startJob().catch((error)=>alert(error.message)));el("reloadJobs").addEventListener("click",()=>loadJobs().catch((error)=>alert(error.message)));
      el("decisionFilter").addEventListener("change",()=>{state.resultPage=1;loadResults().catch((error)=>alert(error.message))});el("resultKeyFilter").addEventListener("change",()=>{state.resultPage=1;loadResults().catch((error)=>alert(error.message))});
      el("prevResult").addEventListener("click",()=>{if(state.resultPage>1){state.resultPage--;loadResults()}});el("nextResult").addEventListener("click",()=>{state.resultPage++;loadResults()});
      el("closeConversation").addEventListener("click",()=>el("conversationModal").classList.add("hidden"));el("conversationModal").addEventListener("click",(event)=>{if(event.target===el("conversationModal"))el("conversationModal").classList.add("hidden")});
      async function init(){const auth=await api("/api/auth/status");if(!auth.authenticated){window.location.href="/";return}setDefaultRange();await Promise.all([loadConfig(),loadKeys(),loadJobs()]);if(state.selectedJobId)await selectJob(state.selectedJobId);el("pageStatus").textContent="已连接";el("pageStatus").className="pill success";startPolling()}
      init().catch((error)=>{el("pageStatus").textContent=error.message;el("pageStatus").className="pill error"});
    </script>
  </body>
</html>
