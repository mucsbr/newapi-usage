<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审计数据清理</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef3f8;
        --text: #142033;
        --muted: #667287;
        --line: rgba(83, 101, 125, 0.2);
        --glass: rgba(255, 255, 255, 0.64);
        --glass-strong: rgba(255, 255, 255, 0.82);
        --input: rgba(255, 255, 255, 0.72);
        --accent: #007aff;
        --accent-strong: #0066d6;
        --accent-soft: rgba(0, 122, 255, 0.1);
        --good: #16845b;
        --good-soft: rgba(22, 132, 91, 0.11);
        --warn: #a96200;
        --warn-soft: rgba(245, 158, 11, 0.13);
        --bad: #d13438;
        --bad-soft: rgba(209, 52, 56, 0.11);
        --shadow: 0 18px 55px rgba(41, 57, 78, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.62);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1119;
          --text: #edf3fb;
          --muted: #95a3b7;
          --line: rgba(172, 190, 215, 0.16);
          --glass: rgba(22, 30, 43, 0.66);
          --glass-strong: rgba(25, 34, 48, 0.84);
          --input: rgba(31, 42, 58, 0.76);
          --accent-soft: rgba(41, 151, 255, 0.14);
          --good-soft: rgba(35, 181, 126, 0.13);
          --warn-soft: rgba(245, 158, 11, 0.14);
          --bad-soft: rgba(255, 91, 96, 0.13);
          --shadow: 0 20px 60px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      button, input { font: inherit; }
      button {
        height: 34px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 7px;
        color: #fff;
        background: linear-gradient(135deg, #007aff, #00a7a0);
        box-shadow: 0 10px 24px rgba(0, 122, 255, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.28);
        cursor: pointer;
        font-weight: 650;
      }
      button:hover { filter: brightness(1.05); }
      button:disabled { cursor: not-allowed; opacity: 0.48; box-shadow: none; }
      button.secondary { color: var(--accent-strong); background: var(--input); border-color: var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
      button.danger { background: linear-gradient(135deg, #d13438, #b4235a); box-shadow: 0 10px 24px rgba(209, 52, 56, 0.22); }
      button.small { height: 28px; padding: 0 9px; font-size: 12px; }
      input {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--input);
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }
      input:focus { border-color: rgba(0, 122, 255, 0.52); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1); }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 22px; line-height: 1.2; }
      h2 { font-size: 15px; }
      h3 { font-size: 13px; }
      .shell { width: min(1180px, calc(100vw - 32px)); margin: 0 auto; }
      header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }
      .topbar { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .top-actions, .actions, .section-head, .job-line { display: flex; align-items: center; gap: 9px; }
      main { display: grid; gap: 14px; padding: 18px 0 40px; }
      .glass { border: 1px solid var(--line); border-radius: 8px; background: var(--glass); box-shadow: var(--shadow); backdrop-filter: blur(28px) saturate(165%); -webkit-backdrop-filter: blur(28px) saturate(165%); }
      .muted { color: var(--muted); }
      .pill { min-height: 24px; display: inline-flex; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--input); white-space: nowrap; }
      .pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 34%, var(--line)); background: var(--good-soft); }
      .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, var(--line)); background: var(--warn-soft); }
      .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 34%, var(--line)); background: var(--bad-soft); }
      .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden; }
      .metric { min-width: 0; min-height: 88px; padding: 15px; border-right: 1px solid var(--line); }
      .metric:last-child { border-right: 0; }
      .metric span { display: block; color: var(--muted); font-size: 12px; }
      .metric strong { display: block; margin-top: 7px; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
      .section { overflow: hidden; }
      .section-head { justify-content: space-between; min-height: 58px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .range-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; padding: 14px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
      .estimate-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); }
      .estimate-item { min-width: 0; padding: 13px 14px; border-right: 1px solid var(--line); }
      .estimate-item:last-child { border-right: 0; }
      .estimate-item span { display: block; color: var(--muted); font-size: 11px; }
      .estimate-item strong { display: block; margin-top: 4px; font-size: 15px; overflow-wrap: anywhere; }
      .notice { margin: 0 14px 14px; padding: 11px 12px; border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); border-radius: 7px; color: var(--warn); background: var(--warn-soft); }
      .cleanup-action { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px 14px; }
      .job-list { display: grid; }
      .job { padding: 13px 14px; border-bottom: 1px solid var(--line); }
      .job:last-child { border-bottom: 0; }
      .job-line { justify-content: space-between; }
      .job-title { min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .job-meta { margin-top: 7px; color: var(--muted); font-size: 12px; }
      .progress { height: 7px; margin-top: 9px; overflow: hidden; border-radius: 4px; background: rgba(120, 137, 158, 0.2); }
      .progress > span { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #007aff, #30d158); transition: width 0.28s ease; }
      .empty { padding: 30px 14px; color: var(--muted); text-align: center; }
      .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: rgba(4, 8, 14, 0.56); }
      .modal.hidden { display: none; }
      .modal-panel { width: min(520px, 100%); overflow: hidden; }
      .modal-body { display: grid; gap: 13px; padding: 15px; }
      .confirm-summary { display: grid; gap: 7px; padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--glass-strong); }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 9px; }
      @media (max-width: 820px) {
        .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .metric:nth-child(2) { border-right: 0; }
        .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
        .range-form { grid-template-columns: 1fr; }
        .estimate-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .estimate-item { border-bottom: 1px solid var(--line); }
        .estimate-item:nth-child(2n) { border-right: 0; }
        .estimate-item:last-child { grid-column: 1 / -1; border-bottom: 0; }
      }
      @media (max-width: 560px) {
        .shell { width: min(100vw - 18px, 1180px); }
        .topbar { align-items: flex-start; padding: 11px 0; }
        .top-actions { flex-wrap: wrap; justify-content: flex-end; }
        .summary { grid-template-columns: 1fr; }
        .metric { border-right: 0; border-bottom: 1px solid var(--line); }
        .metric:last-child { border-bottom: 0; }
        .cleanup-action, .job-line { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell topbar">
        <div><h1>审计数据清理</h1><p class="muted">Audit SQLite</p></div>
        <div class="top-actions"><span id="pageStatus" class="pill">连接中</span><button id="back" class="secondary" type="button">返回总览</button></div>
      </div>
    </header>
    <main class="shell">
      <section class="summary glass">
        <div class="metric"><span>数据库占用</span><strong id="databaseSize">-</strong></div>
        <div class="metric"><span>SQLite 可复用</span><strong id="reusableSize">-</strong></div>
        <div class="metric"><span>审计请求</span><strong id="totalEntries">-</strong></div>
        <div class="metric"><span>数据时间范围</span><strong id="dataRange">-</strong></div>
      </section>

      <section class="section glass">
        <div class="section-head"><div><h2>选择清理范围</h2><p id="rangeMeta" class="muted">等待加载</p></div><span id="indexStatus" class="pill">索引检查中</span></div>
        <div class="range-form">
          <label>开始时间<input id="start" type="datetime-local" /></label>
          <label>结束时间<input id="end" type="datetime-local" /></label>
          <button id="estimate" type="button" disabled>估算范围</button>
        </div>
        <div class="estimate-grid">
          <div class="estimate-item"><span>请求</span><strong id="estimateEntries">-</strong></div>
          <div class="estimate-item"><span>安全告警</span><strong id="estimateAlerts">-</strong></div>
          <div class="estimate-item"><span>日志匹配缓存</span><strong id="estimateMatches">-</strong></div>
          <div class="estimate-item"><span>审查关联记录</span><strong id="estimateReviews">-</strong></div>
          <div class="estimate-item"><span>预计可释放</span><strong id="estimateBytes">-</strong></div>
        </div>
        <div class="notice">清理只删除审计 SQLite 中的数据，不删除 OpenResty 原始 JSONL。释放的空间会先变为 SQLite 内部可复用空间，后续新请求会重复使用；数据库文件不会立即缩小。物理缩小文件需要单独执行数据库重建，并确保磁盘有足够临时空间。</div>
        <div class="cleanup-action"><span id="estimateRange" class="muted">请先估算时间范围</span><button id="openConfirm" class="danger" type="button" disabled>清理所选数据</button></div>
      </section>

      <section class="section glass">
        <div class="section-head"><div><h2>清理任务</h2><p class="muted">任务会分批执行，重启后继续</p></div><button id="refreshJobs" class="secondary small" type="button">刷新</button></div>
        <div id="jobs" class="job-list"><div class="empty">暂无清理任务</div></div>
      </section>
    </main>

    <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel glass">
        <div class="section-head"><div><h2>确认清理</h2><p class="muted">此操作不可恢复</p></div><button id="closeConfirm" class="secondary small" type="button">关闭</button></div>
        <div class="modal-body">
          <div id="confirmSummary" class="confirm-summary"></div>
          <label>输入“清理”确认<input id="confirmText" type="text" autocomplete="off" /></label>
          <div class="confirm-actions"><button id="cancelConfirm" class="secondary" type="button">取消</button><button id="createJob" class="danger" type="button" disabled>开始清理</button></div>
        </div>
      </div>
    </div>

    <script>
      const state = { overview: null, estimate: null, defaultsSet: false, pollTimer: 0 };
      const el = (id) => document.getElementById(id);
      const fmt = new Intl.NumberFormat("zh-CN");
      const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      const tsText = (ts) => ts ? new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false }) : "-";
      const unixToInput = (ts) => { if (!ts) return ""; const d = new Date(ts * 1000); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
      const inputToUnix = (value) => { const ms = new Date(value).getTime(); return Number.isFinite(ms) ? Math.floor(ms / 1000) : 0; };
      const bytesText = (value) => { const bytes = Number(value || 0); if (bytes < 1024) return `${bytes} B`; const units = ["KiB", "MiB", "GiB", "TiB"]; let size = bytes, unit = -1; do { size /= 1024; unit++; } while (size >= 1024 && unit < units.length - 1); return `${size.toFixed(size >= 100 ? 0 : size >= 10 ? 1 : 2)} ${units[unit]}`; };
      const statusText = (value) => ({ queued: "排队中", running: "清理中", completed: "已完成", canceled: "已取消", failed: "失败" })[value] || value;
      const statusClass = (value) => value === "completed" ? "good" : value === "failed" ? "bad" : value === "canceled" ? "warn" : "";
      async function api(path, options = {}) { const response = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options }); const data = await response.json().catch(() => ({})); if (!response.ok) { if (response.status === 401) window.location.href = "/"; throw new Error(data?.error?.message || response.statusText); } return data; }
      function showError(error) { console.error(error); el("pageStatus").textContent = error.message; el("pageStatus").className = "pill bad"; }
      function invalidateEstimate() { state.estimate = null; ["estimateEntries", "estimateAlerts", "estimateMatches", "estimateReviews", "estimateBytes"].forEach((id) => el(id).textContent = "-"); el("estimateRange").textContent = "时间范围已变更，请重新估算"; el("openConfirm").disabled = true; }
      async function loadOverview(setDefaults = false) {
        const data = await api("/api/audit/cleanup");
        state.overview = data;
        if (!data.enabled) { el("pageStatus").textContent = "审计未启用"; el("pageStatus").className = "pill bad"; return; }
        el("databaseSize").textContent = bytesText(data.database_bytes);
        el("reusableSize").textContent = bytesText(data.reusable_bytes);
        el("totalEntries").textContent = data.index_ready ? fmt.format(data.total_entries || 0) : "准备中";
        el("dataRange").textContent = data.index_ready && data.oldest_at ? `${new Date(data.oldest_at * 1000).toLocaleDateString("zh-CN")} - ${new Date(data.newest_at * 1000).toLocaleDateString("zh-CN")}` : "-";
        const progress = Math.max(0, Math.min(100, Number(data.index_progress || 0) * 100));
        el("indexStatus").textContent = data.index_ready ? "目录已就绪" : data.index_error ? "目录重试中" : `目录准备中 ${progress.toFixed(progress >= 10 ? 1 : 2)}%`;
        el("indexStatus").className = `pill ${data.index_ready ? "good" : data.index_error ? "bad" : "warn"}`;
        el("estimate").disabled = !data.index_ready;
        el("rangeMeta").textContent = data.index_ready ? `最老请求 ${tsText(data.oldest_at)}，默认保留最近 30 天` : `正在分批建立轻量清理目录 ${fmt.format(data.index_cursor || 0)} / ${fmt.format(data.index_max_id || 0)}，审计同步可继续运行`;
        if (data.index_ready && (setDefaults || !state.defaultsSet)) { el("start").value = unixToInput(data.default_start); el("end").value = unixToInput(data.default_end); state.defaultsSet = true; invalidateEstimate(); }
        renderJobs(data.latest_cleanup_jobs || []);
        el("pageStatus").textContent = data.index_ready ? "已连接" : "准备中";
        el("pageStatus").className = `pill ${data.index_ready ? "good" : "warn"}`;
        if (!data.index_ready) window.setTimeout(() => loadOverview(false).catch(showError), 3000);
      }
      async function estimateRange() {
        const startAt = inputToUnix(el("start").value), endAt = inputToUnix(el("end").value);
        if (!startAt || !endAt || endAt < startAt) throw new Error("请选择有效的时间范围");
        el("estimate").disabled = true; el("estimate").textContent = "估算中";
        try {
          const data = await api("/api/audit/cleanup/estimate", { method: "POST", body: JSON.stringify({ start_at: startAt, end_at: endAt }) });
          state.estimate = data;
          el("estimateEntries").textContent = fmt.format(data.entry_count || 0);
          el("estimateAlerts").textContent = fmt.format(data.alert_count || 0);
          el("estimateMatches").textContent = fmt.format(data.match_count || 0);
          el("estimateReviews").textContent = fmt.format(data.review_entry_count || 0);
          el("estimateBytes").textContent = bytesText(data.estimated_bytes);
          el("estimateRange").textContent = data.entry_count || data.alert_count ? `${tsText(data.start_at)} 至 ${tsText(data.end_at)}` : "所选范围没有审计数据";
          el("openConfirm").disabled = !(data.entry_count || data.alert_count) || hasActiveJob();
        } finally { el("estimate").disabled = !state.overview?.index_ready; el("estimate").textContent = "估算范围"; }
      }
      function hasActiveJob() { return (state.overview?.latest_cleanup_jobs || []).some((job) => ["queued", "running"].includes(job.status)); }
      function openConfirm() {
        const data = state.estimate; if (!data) return;
        el("confirmSummary").innerHTML = `<div><strong>${fmt.format(data.entry_count || 0)}</strong> 条请求，约 <strong>${bytesText(data.estimated_bytes)}</strong></div><div class="muted">${escapeHtml(tsText(data.start_at))} 至 ${escapeHtml(tsText(data.end_at))}</div><div class="muted">同时移除 ${fmt.format(data.alert_count || 0)} 条告警、${fmt.format(data.match_count || 0)} 条匹配缓存和 ${fmt.format(data.review_entry_count || 0)} 条审查关联记录</div>`;
        el("confirmText").value = ""; el("createJob").disabled = true; el("confirmModal").classList.remove("hidden"); el("confirmText").focus();
      }
      function closeConfirm() { el("confirmModal").classList.add("hidden"); }
      async function createJob() {
        if (!state.estimate || el("confirmText").value.trim() !== "清理") return;
        el("createJob").disabled = true; el("createJob").textContent = "提交中";
        try {
          await api("/api/audit/cleanup/jobs", { method: "POST", body: JSON.stringify({ start_at: state.estimate.start_at, end_at: state.estimate.end_at, confirm: "清理" }) });
          closeConfirm(); invalidateEstimate(); await loadJobs(); startPolling();
        } finally { el("createJob").textContent = "开始清理"; }
      }
      async function loadJobs() { const data = await api("/api/audit/cleanup/jobs?limit=10"); state.overview.latest_cleanup_jobs = data.items || []; renderJobs(data.items || []); if (!(data.items || []).some((job) => ["queued", "running"].includes(job.status))) { stopPolling(); await loadOverview(false); } }
      function renderJobs(items) {
        if (!items.length) { el("jobs").innerHTML = `<div class="empty">暂无清理任务</div>`; return; }
        el("jobs").innerHTML = items.map((job) => {
          const total = Math.max(1, (job.estimated_entries || 0) + (job.estimated_alerts || 0));
          const done = (job.deleted_entries || 0) + (job.deleted_alerts || 0);
          const progress = job.status === "completed" ? 100 : Math.min(99.5, done / total * 100);
          const cancel = ["queued", "running"].includes(job.status) ? `<button class="secondary small" data-cancel-job="${job.id}" type="button">取消</button>` : "";
          return `<div class="job"><div class="job-line"><div class="job-title"><strong>任务 #${job.id}</strong><span class="pill ${statusClass(job.status)}">${escapeHtml(statusText(job.status))}</span><span class="muted">${escapeHtml(tsText(job.start_at))} 至 ${escapeHtml(tsText(job.end_at))}</span></div>${cancel}</div><div class="job-meta">请求 ${fmt.format(job.deleted_entries || 0)} / ${fmt.format(job.estimated_entries || 0)} · 告警 ${fmt.format(job.deleted_alerts || 0)} / ${fmt.format(job.estimated_alerts || 0)} · 已处理约 ${bytesText(job.deleted_bytes)}${job.error ? ` · ${escapeHtml(job.error)}` : ""}</div><div class="progress"><span style="width:${progress}%"></span></div></div>`;
        }).join("");
        document.querySelectorAll("[data-cancel-job]").forEach((button) => button.addEventListener("click", () => cancelJob(button.dataset.cancelJob).catch(showError)));
        el("openConfirm").disabled = !state.estimate || hasActiveJob();
      }
      async function cancelJob(id) { await api(`/api/audit/cleanup/jobs/${id}/cancel`, { method: "POST", body: "{}" }); await loadJobs(); }
      function startPolling() { stopPolling(); state.pollTimer = window.setInterval(() => loadJobs().catch(showError), 1500); }
      function stopPolling() { if (state.pollTimer) window.clearInterval(state.pollTimer); state.pollTimer = 0; }
      async function init() { const auth = await api("/api/auth/status"); if (!auth.authenticated) { window.location.href = "/"; return; } await loadOverview(true); if (hasActiveJob()) startPolling(); }
      el("back").addEventListener("click", () => window.location.href = "/");
      el("estimate").addEventListener("click", () => estimateRange().catch(showError));
      ["start", "end"].forEach((id) => el(id).addEventListener("change", invalidateEstimate));
      el("openConfirm").addEventListener("click", openConfirm);
      el("closeConfirm").addEventListener("click", closeConfirm);
      el("cancelConfirm").addEventListener("click", closeConfirm);
      el("confirmText").addEventListener("input", () => el("createJob").disabled = el("confirmText").value.trim() !== "清理");
      el("createJob").addEventListener("click", () => createJob().catch(showError));
      el("refreshJobs").addEventListener("click", () => loadJobs().catch(showError));
      el("confirmModal").addEventListener("click", (event) => { if (event.target === el("confirmModal")) closeConfirm(); });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeConfirm(); });
      init().catch(showError);
    </script>
  </body>
</html>
